<!doctype html>
<!--
  The repository's social preview (docs/specs/presentation.md §4): 1280 × 640, the glyph, the
  name and the thesis on the left, the hero still (out/media/00-hero.png) bleeding off the right
  edge. Inter from packages/engine/assets/fonts, the app's tokens, a near-black field and no
  gradient. Rendered by lib/social.ts after the hero exists; open it in a browser to tweak it
  (paths are relative to this file).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Recto social preview</title>
    <link rel="stylesheet" href="../../../apps/web/src/styles/tokens.css" />
    <style>
      @font-face {
        font-family: 'Inter';
        font-weight: 400;
        src: url('../../../packages/engine/assets/fonts/Inter-Regular.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 700;
        src: url('../../../packages/engine/assets/fonts/Inter-Bold.ttf') format('truetype');
      }
      html,
      body {
        margin: 0;
      }
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
        position: relative;
        /* --surface-0, the app's canvas: a flat near-black field. */
        background: #08090b;
        color: var(--text-primary, #e6e7ea);
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .brand {
        position: absolute;
        left: 72px;
        top: 72px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brand img {
        width: 48px;
        height: 48px;
      }
      .brand span {
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      /* The thesis, one sentence per line, above the still. */
      .thesis {
        position: absolute;
        left: 72px;
        top: 168px;
        margin: 0;
        font-size: 36px;
        line-height: 48px;
        font-weight: 700;
        letter-spacing: -0.015em;
        white-space: nowrap;
      }
      .thesis span {
        display: block;
      }
      .thesis span + span {
        color: var(--text-secondary, #9a9ea6);
      }
      /* The light table, framed as published (rounded corners and hairline baked in), running
         off the right and bottom edges. */
      .hero {
        position: absolute;
        left: 72px;
        top: 304px;
        width: 1280px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="../../../apps/web/public/icons/glyph.svg" alt="" />
      <span>Recto</span>
    </div>
    <p class="thesis">
      <span>A PDF editor that runs entirely in your browser.</span>
      <span>Nothing is uploaded.</span>
    </p>
    <img class="hero" src="../out/media/00-hero.png" alt="" />
  </body>
</html>
