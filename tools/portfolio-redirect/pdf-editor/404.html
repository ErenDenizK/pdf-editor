<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!--
      Same policy style as the app's 404 page, plus the one script file and the probe of the
      new address. 'self' covers the GitHub Pages target (same origin); the explicit origin
      keeps the probe allowed if the page is ever served from elsewhere.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self' https://erendenizk.github.io; base-uri 'none'; form-action 'none'"
    />
    <!-- Without JavaScript nothing below runs: go to the new address (path and query lost). -->
    <noscript><meta http-equiv="refresh" content="0; url=https://erendenizk.github.io/recto/" /></noscript>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://erendenizk.github.io/recto/" />
    <title>Recto has moved</title>
    <style>
      /* Values copied from apps/web/src/styles/tokens.css (this page cannot load the app's CSS). */
      :root {
        color-scheme: dark;
        --surface-0: #08090b;
        --surface-2: #1f2227;
        --border-strong: rgb(255 255 255 / 0.16);
        --text-primary: #e6e7ea;
        --text-secondary: #9a9ea6;
        --accent: #7c8cff;
        --accent-hover: #8f9dff;
        --warning: #f5c451;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--surface-0);
        color: var(--text-primary);
        font: 16px/1.5 'Inter Variable', 'Inter', ui-sans-serif, system-ui, sans-serif;
      }
      main {
        max-width: 34rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.011em;
        margin: 0 0 1rem;
      }
      p {
        margin: 0 0 0.75rem;
      }
      [lang='tr'] {
        color: var(--text-secondary);
      }
      [data-tone='warning'] {
        color: var(--warning);
      }
      a {
        color: var(--accent);
      }
      a:hover {
        color: var(--accent-hover);
      }
      button {
        font: inherit;
        color: var(--surface-0);
        background: var(--accent);
        border: 0;
        border-radius: 6px;
        padding: 0.5rem 1rem;
        cursor: pointer;
      }
      button:hover {
        background: var(--accent-hover);
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #recipes {
        margin: 1.5rem 0;
        padding: 1rem;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: var(--surface-2);
      }
      #recipe-files {
        list-style: none;
        margin: 0.75rem 0 0;
        padding: 0;
        font-size: 0.875rem;
      }
      [hidden] {
        display: none !important;
      }
    </style>
    <script type="module" src="/pdf-editor/redirect.js"></script>
  </head>
  <body>
    <main>
      <h1>Recto has moved</h1>
      <p id="status" role="status">pdf-editor is now Recto, at a new address. Taking you there…</p>
      <p id="status-tr" lang="tr" hidden>pdf-editor artık Recto, yeni bir adreste. Sizi oraya götürüyoruz…</p>
      <section id="recipes" hidden>
        <p id="recipes-text"></p>
        <p id="recipes-text-tr" lang="tr" hidden></p>
        <button id="recipes-download" type="button">Download your saved recipes</button>
        <ul id="recipe-files"></ul>
      </section>
      <p><a id="target" href="https://erendenizk.github.io/recto/">Open Recto at its new address</a></p>
    </main>
  </body>
</html>
