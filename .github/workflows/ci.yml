# Continuous integration: every push to any branch and every pull request.
# Actions are pinned to major tags here; Renovate (helpers:pinGitHubActionDigests) rewrites
# them to commit digests with the tag kept as a comment.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The Playwright image tag must match @playwright/test in package.json (Renovate groups
    # both). It carries the browsers that Vitest browser mode (engine and web tests)
    # launches. Running as the runner's uid keeps the workspace writable and lets Firefox
    # start. --ipc=host and --init follow Playwright's Docker guide: the host IPC namespace
    # keeps Chromium from running out of shared memory, and --init reaps browser child
    # processes.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host --init
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version read from "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # pw:browser prints the browser's own stderr, so a page that closes mid-run (the web
      # suite's tab died that way in runs 125 and 126) leaves its reason in the log.
      - name: Unit and browser-mode tests
        run: pnpm --filter @pdf-editor/web exec vitest run --reporter=default --reporter=./test/start-reporter.ts
        env:
          DEBUG: pw:browser

      # Two independent renderers (our PDFium build, pdf.js) check every annotation of the
      # committed sample; the sample is regenerated first and must match what is committed.
      - name: Annotation cross-viewer matrix (PDFium, pdf.js)
        run: pnpm --filter @pdf-editor/qa-tool matrix:fresh
        env:
          QA_MATRIX_EVIDENCE_DIR: ${{ runner.temp }}/qa-matrix

      - name: Committed annotation sample and matrix are current
        run: git diff --exit-code -- docs/qa/samples/annotations-sample.pdf docs/qa/annotations-matrix.md

      - name: Upload matrix evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qa-matrix
          path: |
            ${{ runner.temp }}/qa-matrix
            docs/qa/annotations-matrix.md
            docs/qa/samples/annotations-matrix-*.png
          retention-days: 14

      # OCR files (ADR-0012 §3): the committed language packs and tesseract's worker (with its
      # pnpm patch) and cores from node_modules must match packages/engine/ocr/langs.lock.json.
      # Offline; the web build re-checks every file it emits into dist/ocr/.
      - name: OCR files match their lock
        run: pnpm --filter @pdf-editor/engine ocr:verify

      - name: Build
        run: pnpm build

      # Downloadable preview of this commit's build (ADR-0004); also reused by e2e below.
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.project }} ${{ matrix.shard }}/2)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host --init
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist

      - name: Playwright
        run: >-
          pnpm --filter @pdf-editor/web test:e2e
          --project=${{ matrix.project }}
          --shard=${{ matrix.shard }}/2
        env:
          E2E_SKIP_BUILD: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  # Public copy and links (docs/specs/presentation.md §1.3, §8 "Links"). A plain runner: no
  # browsers. After `verify`, so the built about page (base path `/`) can be checked too.
  docs:
    name: Copy and links
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Banned words, exclamation marks and emoji in README.md, apps/web/about/ and
      # .github/release-notes.md. No dependencies, so no install.
      - name: Copy check
        run: node --experimental-strip-types --no-warnings=ExperimentalWarning tools/copy-check/check.ts

      # lychee's configuration (lychee.toml) is written for this version. The research
      # snapshots are dated and cite hundreds of third-party pages that rot by design, so
      # they are checked offline (local files and anchors); the public documents online.
      - name: Links in the documentation
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: >-
            --config lychee.toml --no-progress
            README.md CONTRIBUTING.md SECURITY.md
            'docs/*.md' 'docs/adr/*.md' 'docs/specs/*.md' 'docs/design/*.md' 'docs/qa/*.md'

      - name: Local links in the research snapshots
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: >-
            --config lychee.toml --no-progress --offline
            'docs/research/*.md'

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist

      # Root-relative links in the built page resolve against dist/; the media it shows are
      # built by the deploy workflow only and are excluded in lychee.toml.
      - name: Links in the built about page
        if: hashFiles('apps/web/dist/about/index.html') != ''
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: >-
            --config lychee.toml --no-progress
            --root-dir ${{ github.workspace }}/apps/web/dist
            apps/web/dist/about/index.html
