# Deploys the site to GitHub Pages (ADR-0004, ADR-0016): the app, its about page and the
# README and about-page media under media/ (docs/specs/presentation.md §2.6).
# Actions are pinned to major tags here; Renovate (helpers:pinGitHubActionDigests) rewrites
# them to commit digests with the tag kept as a comment.
#
# Branches: ADR-0017 §7 builds the public site from `main` only, which always holds the
# latest release. Until the first release (1.0.0-beta.0) creates `main`, the owner
# dispatches this workflow from `develop`. In the release commit, add
#   if: github.ref == 'refs/heads/main'
# to the `deploy` job so that a dispatch from any other branch is refused.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version read from "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@v5

      # Project sites live under /<repository>/. With a custom domain (repository variable
      # CUSTOM_DOMAIN), the site is served from the domain root instead.
      - name: Build
        run: pnpm build
        env:
          VITE_BASE_PATH: ${{ vars.CUSTOM_DOMAIN && '/' || format('/{0}/', github.event.repository.name) }}

      # Not the Pages artifact yet: the `pages` job adds media/ to it first.
      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1

  media:
    name: Media
    needs: build
    # A plain runner, not the Playwright container (its ffmpeg is stripped).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Record media
        uses: ./.github/actions/media

      - name: Upload media
        uses: actions/upload-artifact@v7
        with:
          name: media
          path: tools/media/out/media
          if-no-files-found: error
          retention-days: 30

      - name: Upload scene results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: media-test-results
          path: tools/media/out/test-results
          retention-days: 14

  pages:
    name: Pages artifact
    needs: [build, media]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      # Served at <site>/media/<id>.gif; the README points at these URLs.
      - name: Download media
        uses: actions/download-artifact@v8
        with:
          name: media
          path: site/media

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
